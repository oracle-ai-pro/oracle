<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Core Node — Подтверждение</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0b10;
      --surface: #14151f;
      --surface-variant: #1f202e;
      --on-surface: #e3e2e6;
      --on-surface-variant: #c7c6ca;
      --primary: #adc6ff;
      --primary-container: #254487;
      --border: #434753;
      --danger: #ff5252;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--on-surface);
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,.45);
    }
    .icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: var(--primary-container); color: var(--primary);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 16px;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { font-size: 13px; color: var(--on-surface-variant); line-height: 1.5; margin: 0 0 16px; }
    .empty {
      text-align: center; color: var(--on-surface-variant); font-size: 14px;
      opacity: .55; padding: 40px 10px;
    }
    .device-list {
      background: var(--surface-variant);
      border-radius: 14px; padding: 14px 16px; margin-bottom: 18px;
      font-size: 12px; line-height: 1.55;
    }
    .device-list div { margin-bottom: 6px; }
    .device-list b { color: var(--on-surface); font-weight: 600; }
    .actions { display: flex; flex-direction: column; gap: 10px; }
    button {
      border: none; border-radius: 12px; padding: 14px 16px;
      font-weight: 700; font-size: 14px; cursor: pointer;
    }
    .btn-ok { background: var(--primary); color: #0a0b10; }
    .btn-no { background: transparent; color: var(--on-surface); border: 1px solid var(--border); }
    .btn-wipe { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
    .warn {
      font-size: 11px; color: #ff9f0a; margin-top: 12px; line-height: 1.4;
    }
    .status { margin-top: 14px; font-size: 13px; text-align: center; }
  </style>
</head>
<body>
  <div class="card" id="root">
    <div class="empty" id="empty-state">Нет данных для отображения.</div>
  </div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const token = params.get('t') || '';
  const infoRaw = params.get('info') || '';
  const root = document.getElementById('root');

  // Bare confirm.html — nothing useful
  if (!token && !infoRaw) {
    return;
  }

  let pending = null;
  try { pending = JSON.parse(localStorage.getItem('oracle_recovery_pending') || 'null'); } catch (e) {}

  let info = null;
  try {
    info = JSON.parse(decodeURIComponent(escape(atob(infoRaw))));
  } catch (e) {
    try { info = JSON.parse(atob(infoRaw)); } catch (e2) { info = null; }
  }

  const validToken = pending && pending.token === token && pending.expires > Date.now();

  if (!validToken) {
    root.innerHTML = '<div class="icon"><span class="material-symbols-rounded">link_off</span></div>' +
      '<h1>Ссылка недействительна</h1>' +
      '<p>Токен истёк, уже использован или открыт не в том браузере, где создавался запрос. Откройте ссылку на том же устройстве, где стоит Core Node, или создайте новую из «Забыл PIN».</p>';
    return;
  }

  const d = info || pending.device || {};
  root.innerHTML =
    '<div class="icon"><span class="material-symbols-rounded">verified_user</span></div>' +
    '<h1>Подтверждение восстановления</h1>' +
    '<p>Проверьте данные устройства. Нажимая «Это я», вы подтверждаете, что это ваш запрос, и принимаете риски, если устройство скомпрометировано.</p>' +
    '<div class="device-list">' +
      '<div><b>Платформа:</b> ' + esc(d.platform || '—') + '</div>' +
      '<div><b>Экран:</b> ' + esc(d.screen || '—') + '</div>' +
      '<div><b>Часовой пояс:</b> ' + esc(d.tz || '—') + '</div>' +
      '<div><b>Язык:</b> ' + esc(d.lang || '—') + '</div>' +
      '<div><b>Хост:</b> ' + esc(d.host || '—') + '</div>' +
      '<div><b>Время запроса:</b> ' + esc(d.when || '—') + '</div>' +
    '</div>' +
    '<div class="actions">' +
      '<button type="button" class="btn-ok" id="btn-yes">Это я — сбросить PIN</button>' +
      '<button type="button" class="btn-no" id="btn-no">Это не я</button>' +
      '<button type="button" class="btn-wipe" id="btn-wipe">Удалённо сбросить данные</button>' +
    '</div>' +
    '<p class="warn">PIN в ссылке не передаётся. Действие необратимо для PIN / данных на этом браузере.</p>' +
    '<div class="status" id="status"></div>';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  document.getElementById('btn-yes').onclick = function () {
    localStorage.removeItem('oracle_pin_hash');
    localStorage.removeItem('oracle_recovery_pending');
    sessionStorage.setItem('oracle_pin_ok', '1');
    document.getElementById('status').textContent = 'PIN сброшен. Можно открыть Core Node и задать новый.';
    setTimeout(() => { location.href = 'index.html'; }, 1200);
  };
  document.getElementById('btn-no').onclick = function () {
    localStorage.removeItem('oracle_recovery_pending');
    document.getElementById('status').textContent = 'Запрос отклонён. Токен аннулирован.';
    root.querySelector('.actions').style.display = 'none';
  };
  document.getElementById('btn-wipe').onclick = function () {
    if (!confirm('Удалить ВСЕ данные Core Node в этом браузере?')) return;
    const keep = ['oracle_onboarding_done', 'oracle_consent'];
    Object.keys(localStorage).forEach(k => {
      if (k.startsWith('oracle_') && !keep.includes(k)) localStorage.removeItem(k);
    });
    sessionStorage.clear();
    document.getElementById('status').textContent = 'Данные очищены.';
    setTimeout(() => { location.href = 'index.html'; }, 1000);
  };
})();
  </script>
</body>
</html>
